<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>熙熙的鸽子窝</title>
    <link rel="stylesheet" href="css/base.css?v=d08d49d">
    <link rel="stylesheet" href="css/nav.css?v=d08d49d">
    <link rel="stylesheet" href="css/layout.css?v=d08d49d">
    <link rel="stylesheet" href="css/article.css?v=d08d49d">
    <link rel="stylesheet" href="css/toc.css?v=d08d49d">
    <link rel="stylesheet" href="css/lightbox.css?v=d08d49d">
    <link rel="stylesheet" href="css/page-main.css?v=d08d49d">
    <link rel="stylesheet" href="css/page-friends.css?v=d08d49d">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.11.1/styles/atom-one-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.11.1/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
</head>
<body>

    <nav class="site-nav">
        <div class="nav-container">
            <a href="#" class="nav-logo" data-page="page-main">熙熙的鸽子窝</a>
            <div class="nav-links-wrapper">
                <ul class="nav-links">
                    <li><a href="#" data-page="page-article">文章</a></li>
                    <li><a href="#" data-page="page-projects">作品</a></li>
                    <li><a href="#" data-page="page-about">关于</a></li>
                    <li><a href="#" data-page="page-friends">友链</a></li>
                </ul>
                <div class="nav-indicator"></div>
            </div>
        </div>
    </nav>

    <div id="app">
        <section id="page-main" class="page active">
            <div id="main-canvas"></div>
        </section>

        <section id="page-article" class="page">
            <main>
                <div class="search-row">
                    <div class="search-input">
                        <input type="text" id="search-input" placeholder="搜索文章..." style='color: #fff;'>
                        <button id="search-btn" aria-label="搜索">
                            <!--使用SVG图标-->
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="9" cy="9" r="7" stroke="white" stroke-width="2"/>
                                <line x1="14.2" y1="14.2" x2="18" y2="18" stroke="white" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </button>
                    </div>
                    <button id="tag-filter-btn" class="tag-filter-btn">按标签分类</button>
                </div>
                <div id="tag-list-panel" class="tag-list-panel"></div>
                <div id="article-list"></div>
            </main>
        </section>

        <section id="page-article-detail" class="page">
            <main>
                <div class="card">
                    <button class="back-btn" id="back-btn">返回文章列表</button>
                    <div id="article-content"></div>
                    <div class="article-bottom-nav">
                        <button id="prev-article-btn" class="back-btn article-nav-btn" style="display:none"></button>
                        <button id="next-article-btn" class="back-btn article-nav-btn" style="display:none"></button>
                    </div>
                </div>
            </main>
        </section>

        <section id="page-projects" class="page">
            <main>
                <div class="card">
                    <p>作品集</p>
                </div>
            </main>
        </section>

        <section id="page-about" class="page">
            <main>
                <div class="card">
                    <div id="self-introduction-card" class="mc">
                        <div id="article-content"></div>
                    </div>
                </div>
            </main>
        </section>

        <section id="page-friends" class="page">
            <main>
                <div id="friends-list" class="friends-list"></div>
            </main>
        </section>
    </div>

    <script src="js/bg-effect.js?v=d08d49d"></script>
    <script src="data/articles_data.js?v=d08d49d"></script>
    <script src="data/play_list.js?v=d08d49d"></script>
    <script src="data/profile.js?v=d08d49d"></script>
    <script src="data/friends.js?v=d08d49d"></script>
    <script src="js/animations/registry.js?v=d08d49d"></script>
    <script src="js/animations/default.js?v=d08d49d"></script>
    <script src="js/animations/page-main.js?v=d08d49d"></script>
    <script src="js/animations/page-article.js?v=d08d49d"></script>
    <script src="js/animations/page-article-detail.js?v=d08d49d"></script>
    <script src="js/animations/page-projects.js?v=d08d49d"></script>
    <script src="js/animations/page-about.js?v=d08d49d"></script>
    <script src="js/animations/page-friends.js?v=d08d49d"></script>
    <script src="js/weather-icons.js?v=d08d49d"></script>
    <script src="js/home.js?v=d08d49d"></script>
    <script src="js/about.js?v=d08d49d"></script>
    <script src="js/friends.js?v=d08d49d"></script>
    <script src="js/nav.js?v=d08d49d"></script>
    <!-- TOC 容器置于 body 末尾，脱离 .page 的 transform 影响，使 fixed 定位相对视口生效 -->
    <div id="toc-container" style="display:none">
        <div id="toc-panel">
            <div id="toc-tags" class="toc-tags-section"></div>
            <div class="toc-panel-title">目录</div>
            <nav id="toc-nav"></nav>
        </div>
        <button id="toc-toggle-btn" aria-label="切换目录">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                <line x1="2" y1="4" x2="16" y2="4" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="2" y1="9" x2="16" y2="9" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="2" y1="14" x2="16" y2="14" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
        </button>
    </div>

    <!-- 灯箱覆盖层：置于 body 末尾，避免被 .page 的 transform 影响 fixed 定位 -->
    <div id="lightbox-overlay">
        <img id="lightbox-img">
    </div>

    <script src="js/router.js?v=d08d49d"></script>
    <script src="js/lightbox.js?v=d08d49d"></script>
    <script src="js/article.js?v=d08d49d"></script>
    <script src="js/toc.js?v=d08d49d"></script>
    <script src="js/main.js?v=d08d49d"></script>
</body>
</html>
