name: 功能请求
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提出新功能建议！请详细描述你的想法，我们会认真评估。

  - type: textarea
    id: problem
    attributes:
      label: 你的功能请求是否与某个痛点相关？
      description: 清晰描述你遇到的问题或不便之处。例如："每次我想做 X 的时候，都会因为 Y 而感到很麻烦..."
      placeholder: 例如：我希望能够在手机上也能方便地浏览文章，目前移动端体验不太好。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你期望的解决方案
      description: 清晰描述你希望实现的功能或改进。
      placeholder: 例如：希望页面能够支持响应式布局，在手机上有汉堡菜单和更适合触控的排版。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 如果你考虑过其他变通方案，请在这里描述。

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 任何有助于我们理解该功能需求的其他信息，如参考链接、草图、参考设计等。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issues，确认没有其他人提出过相同的功能请求
          required: true
        - label: 该功能适合作为项目通用功能，而非仅适用于我的个人场景
          required: true
