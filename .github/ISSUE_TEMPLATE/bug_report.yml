name: 缺陷报告
description: 提交一个 bug 或异常行为
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间提交这个 bug 报告！请尽可能提供详细信息以帮助我们复现和修复问题。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰简洁地描述你遇到的问题。
      placeholder: 例如：点击导航栏链接后页面没有跳转到对应位置。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请列出能够复现该问题的具体操作步骤。
      placeholder: |
        1. 打开 '...'
        2. 点击 '...'
        3. 滚动到 '...'
        4. 查看错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 清晰描述你期望发生的正确行为。
      placeholder: 页面应该跳转到对应锚点位置。
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏
      description: 如果方便，请附上截图或录屏来帮助说明问题。可以直接粘贴图片。

  - type: input
    id: browser
    attributes:
      label: 浏览器及版本
      description: 你使用的是什么浏览器和版本？
      placeholder: 例如：Chrome 125、Edge 124、Firefox 126
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统
      description: 你使用的是什么操作系统？
      placeholder: 例如：Windows 11、macOS 14、Ubuntu 24.04

  - type: dropdown
    id: deploy
    attributes:
      label: 部署方式
      description: 你是通过什么方式访问的博客？
      options:
        - GitHub Pages 在线访问
        - 本地运行（start_blog.ps1）
        - 其他部署方式
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issues，确认没有其他人提交过相同问题
          required: true
        - label: 我确认这是项目代码本身的问题，而非个人部署或浏览器配置问题
          required: true
